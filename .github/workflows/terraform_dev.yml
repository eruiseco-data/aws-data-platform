name: terraform-dev
on:
  pull_request:
    paths: ["infra/**",".github/workflows/terraform_dev.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # deja que GitHub emita el token OIDC
  contents: read    # deja leer el código del repo

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4terr
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan -no-color